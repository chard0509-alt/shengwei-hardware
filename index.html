  const cls = { '熱銷':'bg-red-500','超熱':'bg-red-600','升級':'bg-blue-500','新品':'bg-emerald-500','超低':'bg-orange-500','超值':'bg-orange-500','特價':'bg-purple-500' };
  return <span className={`absolute top-2 left-2 text-white text-xs font-bold px-2 py-0.5 rounded-full z-10 ${cls[text]||'bg-gray-500'}`}>{text}</span>;
}

function ProductCard({ product, onAdd }) {
  const [added, setAdded] = useState(false);
  const handleAdd = () => {
    onAdd(product);
    setAdded(true);
    setTimeout(() => setAdded(false), 1200);
  };
  return (
    <div className="product-card bg-white rounded-2xl shadow-sm hover:shadow-md transition-all duration-300 overflow-hidden flex flex-col border border-gray-100">
      <div className="relative overflow-hidden bg-gradient-to-br from-brand-50 to-green-50 h-36 flex items-center justify-center">
        <Badge text={product.badge} />
        <span className="product-img text-6xl transition-transform duration-500">{product.img}</span>
        {product.sold && (
          <span className="absolute bottom-2 right-2 text-xs text-gray-400 bg-white/80 px-1.5 py-0.5 rounded-full">售出 {product.sold}</span>
        )}
      </div>
      <div className="p-3 flex flex-col flex-1">
        <h3 className="font-semibold text-gray-800 text-xs leading-snug mb-1 line-clamp-2">{product.name}</h3>
        <p className="text-xs text-gray-400 mb-2 flex-1 line-clamp-2">{product.desc}</p>
        <div className="flex items-end justify-between gap-1">
          <div>
            <span className="text-brand-600 font-bold text-base">NT$ {fmt(product.price)}</span>
            <span className="text-gray-400 text-xs ml-0.5">/{product.unit}</span>
          </div>
          <button
            onClick={handleAdd}
            className={`flex-shrink-0 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 ${
              added ? 'bg-green-400 text-white scale-95' : 'bg-brand-500 hover:bg-brand-600 text-white'
            }`}
          >
            {added ? '✓ 已加入' : '+ 加入'}
          </button>
        </div>
      </div>
    </div>
  );
}

function CartPanel({ cart, onClose, onIncrease, onDecrease, onRemove, onInquire }) {
  const total = cart.reduce((s,i) => s + i.price * i.qty, 0);
  return (
    <div className="fixed inset-0 z-50 flex justify-end">
      <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={onClose} />
      <div className="relative w-full max-w-md bg-white h-full flex flex-col shadow-2xl">
        <div className="flex items-center justify-between px-5 py-4 border-b sticky top-0 bg-white z-10">

          <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl leading-none">×</button>
        </div>
        {cart.length === 0 ? (
          <div className="flex-1 flex flex-col items-center justify-center text-gray-400 gap-3">
            <span className="text-6xl">🛒</span><p>購物車是空的</p>

        ) : (
          <div className="flex-1 overflow-y-auto px-5 py-4 space-y-3 scrollbar-hide">
            {cart.map(item => (
              <div key={item.id} className="flex items-center gap-3 bg-gray-50 rounded-xl p-3">
                <span className="text-3xl flex-shrink-0">{item.img}</span>
                <div className="flex-1 min-w-0">
                  <p className="text-xs font-medium text-gray-800 line-clamp-2">{item.name}</p>
                  <p className="text-brand-600 text-sm font-semibold mt-0.5">NT$ {fmt(item.price)}/{item.unit}</p>

                  <span className="w-7 text-center text-sm font-semibold">{item.qty}</span>

                  <button onClick={() => onRemove(item.id)} className="w-7 h-7 rounded-full bg-red-50 text-red-400 hover:bg-red-100 flex items-center justify-center ml-1 text-sm">🗑</button>

          </div>
        )}
      </div>
    </div>
  );
}

/* ───── MAIN APP ───── */
function App() {
  const [activeCategory, setActiveCategory] = useState('all');
  const [search, setSearch] = useState('');
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [lineOpen, setLineOpen] = useState(false);

  const addToCart = useCallback((product) => {
    setCart(prev => {
      const ex = prev.find(i => i.id === product.id);
      if (ex) return prev.map(i => i.id === product.id ? { ...i, qty: i.qty+1 } : i);
      return [...prev, { ...product, qty: 1 }];
    });
  }, []);

  const increase = useCallback((id) => setCart(prev => prev.map(i => i.id===id ? {...i,qty:i.qty+1} : i)), []);
  const decrease = useCallback((id) => setCart(prev => {
    const item = prev.find(i=>i.id===id);
    if (item.qty<=1) return prev.filter(i=>i.id!==id);
    return prev.map(i=>i.id===id?{...i,qty:i.qty-1}:i);
  }), []);
  const remove = useCallback((id) => setCart(prev => prev.filter(i=>i.id!==id)), []);

  const cartCount = cart.reduce((s,i)=>s+i.qty,0);

  const filtered = PRODUCTS.filter(p => {
    const matchCat = activeCategory==='all' || p.cat===activeCategory;
    const q = search.toLowerCase();
    const matchSearch = !search || p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });

  const catRef = useRef(null);
  const scrollCat = dir => { if(catRef.current) catRef.current.scrollLeft += dir*120; };

  return (
    <div className="min-h-screen bg-gray-50">
      <Header cartCount={cartCount} onCartOpen={() => setCartOpen(true)} />
      <Hero />

      {/* Category + Search */}
      <div className="bg-white border-b border-gray-100 sticky top-16 z-30">
        <div className="max-w-6xl mx-auto px-4">
          <div className="pt-3 pb-2">
            <div className="relative max-w-lg">
              <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">🔍</span>
              <input type="text" placeholder="搜尋商品…" value={search} onChange={e=>setSearch(e.target.value)}
                className="w-full pl-9 pr-8 py-2 text-sm bg-gray-100 rounded-lg outline-none focus:ring-2 focus:ring-brand-400 transition" />
              {search && <button onClick={()=>setSearch('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">×</button>}
            </div>
          </div>
          <div className="relative flex items-center">
            <button onClick={()=>scrollCat(-1)} className="absolute left-0 z-10 bg-white shadow-md rounded-full w-7 h-7 items-center justify-center text-gray-500 text-xs flex-shrink-0 md:hidden flex">‹</button>
            <div ref={catRef} className="flex gap-2 overflow-x-auto scrollbar-hide py-3 px-1 scroll-smooth">
              {CATEGORIES.map(c => (
                <button key={c.id} onClick={()=>setActiveCategory(c.id)}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold flex-shrink-0 transition-all duration-200 ${
                    activeCategory===c.id ? 'bg-brand-500 text-white shadow-md scale-105' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                  }`}>
                  <span>{c.icon}</span><span>{c.label}</span>
                </button>
              ))}
            </div>
            <button onClick={()=>scrollCat(1)} className="absolute right-0 z-10 bg-white shadow-md rounded-full w-7 h-7 items-center justify-center text-gray-500 text-xs flex-shrink-0 md:hidden flex">›</button>
          </div>
        </div>
      </div>

      {/* Products */}
      <main className="max-w-6xl mx-auto px-4 py-8">
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-bold text-gray-700 text-sm">
            {CATEGORIES.find(c=>c.id===activeCategory)?.label || '全部商品'}
            <span className="text-gray-400 font-normal ml-2">({filtered.length} 件)</span>
          </h2>
          {search && <p className="text-sm text-brand-600">搜尋：「{search}」</p>}
        </div>

        {filtered.length === 0 ? (
          <div className="text-center py-20 text-gray-400">
            <p className="text-5xl mb-4">😔</p>
            <p>找不到符合的商品</p>
            <button onClick={()=>{setSearch('');setActiveCategory('all');}} className="mt-3 text-brand-500 text-sm hover:underline">清除篩選</button>
          </div>
        ) : (
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3">
            {filtered.map(p => <ProductCard key={p.id} product={p} onAdd={addToCart} />)}
          </div>
        )}
      </main>

      {/* Footer */}
      <footer className="bg-gray-800 text-gray-300 mt-16">
        <div className="max-w-6xl mx-auto px-4 py-10 grid sm:grid-cols-3 gap-8">

              <span className="font-bold text-white">昇瑋鋁窗五金行</span>
            </div>
            <p className="text-sm text-gray-400 leading-relaxed">專業鋁窗五金材料供應，門窗密封條、門檔、信箱、鎖具批發零售，蝦皮 15 萬粉絲信賴品牌。</p>
          </div>
          <div>
            <h4 className="font-semibold text-white mb-3">聯絡資訊</h4>
            <ul className="space-y-2 text-sm text-gray-400">
              <li className="flex items-center gap-2">📍 南投縣竹山鎮埔頭街一巷15號</li>
              <li className="flex items-center gap-2">📞 049-264-4518</li>
              <li className="flex items-center gap-2">🏢 美升鋁門窗・統編 06144594</li>
              <li className="flex items-center gap-2">⏰ 週一至週六 08:00 – 18:00</li>
            </ul>
          </div>
          <div>
            <h4 className="font-semibold text-white mb-3">線上商店</h4>
            <ul className="space-y-2 text-sm text-gray-400">
              <li><a href="https://shopee.tw/shengwei0518" target="_blank" rel="noopener noreferrer" className="hover:text-orange-400 flex items-center gap-2 transition-colors">🛍 蝦皮商店 shengwei0518</a></li>
              <li><a href="https://line.me/ti/p/@shengwei_hardware" target="_blank" rel="noopener noreferrer" className="hover:text-green-400 flex items-center gap-2 transition-colors"><span className="text-green-500">●</span> LINE 官方帳號</a></li>
              {CATEGORIES.slice(1).map(c=>(
                <li key={c.id}><button onClick={()=>{setActiveCategory(c.id);window.scrollTo({top:0,behavior:'smooth'});}} className="hover:text-white transition-colors">{c.icon} {c.label}</button></li>
              ))}
            </ul>
          </div>
        </div>
        <div className="border-t border-gray-700 py-4 text-center text-xs text-gray-500">
          © 2025 昇瑋鋁窗五金行 All Rights Reserved ・ 美升鋁門窗 統編 06144594
        </div>
      </footer>

      {/* Floating LINE */}
      <a href="https://line.me/ti/p/@shengwei_hardware" target="_blank" rel="noopener noreferrer"
         className="fixed bottom-6 right-6 z-40 bg-green-500 hover:bg-green-600 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg hover:shadow-xl transition-all hover:scale-110" title="LINE 詢價">
        <LineIcon className="w-8 h-8" />
      </a>

      {cartOpen && <CartPanel cart={cart} onClose={()=>setCartOpen(false)} onIncrease={increase} onDecrease={decrease} onRemove={remove} onInquire={()=>{setCartOpen(false);setLineOpen(true);}} />}
      {lineOpen && <LineModal cart={cart} onClose={()=>setLineOpen(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
